<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极小额度窗 · 横向与竖向</title>
<style>
  :root { color-scheme:light; --ink:#253c37; --muted:#687771; --line:#dce3dc; --paper:#f6f7f3; --green:#386f58; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.6 "Segoe UI","Microsoft YaHei UI",sans-serif; }
  button,select { font:inherit; }
  button { cursor:pointer; }
  button:focus-visible,select:focus-visible { outline:2px solid #42765d; outline-offset:4px; }
  [hidden] { display:none !important; }
  .page { max-width:1100px; margin:auto; padding:30px 36px 24px; }
  .topline { display:flex; justify-content:space-between; align-items:center; gap:20px; padding-bottom:16px; border-bottom:1px solid var(--line); font-size:12px; }
  .wordmark { letter-spacing:.12em; font-weight:600; }
  .edition { color:var(--muted); }
  .intro { display:flex; justify-content:space-between; align-items:end; gap:20px; margin:27px 0 23px; }
  h1 { font-size:30px; line-height:1.3; font-weight:500; letter-spacing:-1px; margin:0 0 8px; }
  p { color:var(--muted); margin:0; }
  .intro-note { text-align:right; font-size:12px; }
  .options { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .option { padding:0; overflow:hidden; border:1px solid var(--line); background:#fff; border-radius:12px; text-align:left; color:inherit; }
  .option[aria-pressed="true"] { border-color:var(--green); box-shadow:0 0 0 1px var(--green); }
  .sample { height:170px; display:grid; place-items:center; background:radial-gradient(ellipse at 15% 10%,#e2efeb,transparent 80%),#c5dce0; pointer-events:none; }
  .option-meta { display:block; padding:14px 16px; }
  .option-title { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:5px; }
  .option-name { font-size:15px; font-weight:600; }
  .option-size { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .option-description { display:block; font-size:12px; color:var(--muted); }
  .choice-mark { display:inline-grid; place-items:center; width:17px; height:17px; border:1px solid #aab8af; border-radius:50%; margin-right:8px; color:transparent; font-size:11px; vertical-align:1px; }
  .option[aria-pressed="true"] .choice-mark { background:var(--green); border-color:var(--green); color:#fff; }
  .preview-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:24px 0 12px; }
  .preview-title { font-weight:600; }
  .preview-title small { font-size:12px; font-weight:400; color:var(--muted); margin-left:8px; }
  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  select { font-size:12px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); padding:4px 20px 4px 8px; }
  .check { display:flex; align-items:center; gap:5px; cursor:pointer; }
  input { accent-color:var(--green); }
  .desk { position:relative; height:320px; border-radius:12px; overflow:hidden; isolation:isolate; background:radial-gradient(ellipse at 5% 0,#dfefeb,transparent 70%),radial-gradient(ellipse at 85% 100%,#7daeba,transparent 70%),#bed9df; }
  .desk.dark { background:radial-gradient(ellipse at 5% 0,#375658,transparent 70%),radial-gradient(ellipse at 85% 100%,#193544,transparent 70%),#243f46; }
  .desk-label { position:absolute; top:18px; left:22px; color:#4a6a6e; font-size:11px; letter-spacing:.06em; }
  .desk-hint { position:absolute; left:22px; right:22px; bottom:17px; font-size:12px; color:#4a6a6e; pointer-events:none; }
  .dark .desk-label,.dark .desk-hint { color:#c0d1d3; }
  .reference { position:absolute; right:26px; top:75px; width:120px; height:56px; border:1px dashed #67868b; border-radius:7px; pointer-events:none; }
  .reference-label { position:absolute; left:0; top:-23px; color:#4a6a6e; font-size:11px; white-space:nowrap; }
  .reference-body { padding:6px 8px; opacity:.55; color:#3b605f; font-size:11px; line-height:14px; }
  .reference-body div { display:flex; justify-content:space-between; }
  .dark .reference { border-color:#8faeb1; }
  .dark .reference-label,.dark .reference-body { color:#d3e1dc; }
  .floating { position:absolute; left:50%; top:118px; transform:translateX(-50%); z-index:2; }
  .widget { --surface:#fff; --fg:#293b35; --sub:#6c7b74; --edge:#dce7de; --hover:#eef4ef; position:relative; background:var(--surface); color:var(--fg); border-radius:6px; box-shadow:0 4px 14px #1c3a4026,0 0 0 1px #263f3910; font:11px/1 "Segoe UI","Microsoft YaHei UI",sans-serif; font-variant-numeric:tabular-nums; user-select:none; touch-action:none; cursor:grab; }
  .widget:active { cursor:grabbing; }
  .widget.ink { --surface:#222c29; --fg:#edf3ee; --sub:#a4b7ac; --edge:#3c4c43; --hover:#34433a; }
  .widget.horizontal { width:136px; height:24px; padding:0 8px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .widget.vertical { width:44px; height:88px; padding:8px 6px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .pair { display:flex; align-items:baseline; justify-content:space-between; gap:5px; }
  .horizontal .pair { flex:1; min-width:0; }
  .vertical .pair { flex:none; width:32px; height:32px; flex-direction:column; align-items:center; justify-content:start; gap:0; }
  .period { color:var(--sub); font-size:11px; white-space:nowrap; line-height:14px; }
  .amount { font-size:12px; font-weight:600; line-height:18px; white-space:nowrap; }
  .amount i { font-size:10px; color:var(--sub); font-weight:400; font-style:normal; }
  .widget.stale .period { color:#aa6522; }
  .widget.ink.stale .period { color:#edb776; }
  .details,.menu { position:absolute; width:218px; padding:11px 13px; background:var(--surface); color:var(--fg); border:1px solid var(--edge); border-radius:8px; box-shadow:0 8px 24px #15302e26; cursor:default; font-size:11px; line-height:1.6; z-index:4; user-select:text; }
  .details-title { font-size:12px; font-weight:600; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .details-row { display:flex; justify-content:space-between; gap:12px; color:var(--sub); }
  .details-row strong { color:var(--fg); font-weight:400; }
  .details footer { color:var(--sub); margin-top:6px; padding-top:6px; border-top:1px solid var(--edge); }
  .small-button { padding:0 3px; border:0; border-radius:3px; background:transparent; color:var(--sub); font-family:inherit; font-size:12px; line-height:16px; }
  .small-button:hover { background:var(--hover); }
  .menu { width:138px; padding:5px; }
  .menu button { display:block; width:100%; padding:7px 8px; border:0; border-radius:4px; text-align:left; color:var(--fg); background:transparent; font-size:11px; }
  .menu button:hover { background:var(--hover); }
  .bottom { display:flex; justify-content:space-between; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin-top:14px; }
  .selected-note { color:var(--green); }
  .text-button { background:transparent; color:var(--muted); padding:0; border:0; border-bottom:1px solid currentColor; font-size:12px; }
  .footnote { color:var(--muted); font-size:12px; margin-top:17px; }
  @media(max-width:720px) { .page { padding:23px 18px; } .intro { flex-direction:column; align-items:start; gap:10px; } .intro-note { text-align:left; } h1 { font-size:27px; } .option-title { align-items:start; flex-direction:column; gap:3px; } .option-meta { padding:12px; } .option-name { font-size:14px; } .sample { height:150px; } .reference { right:16px; top:66px; } .floating { top:150px; } }
  @media(max-width:460px) { .options { gap:10px; } .option-meta { padding:10px; } .option-name { font-size:13px; } .choice-mark { margin-right:5px; width:14px; height:14px; } .option-description { font-size:11px; } .topline { gap:12px; font-size:11px; } .controls { gap:8px; } .desk { height:340px; } .reference-label { font-size:10px; } }
</style>
</head>
<body>
<main class="page">
  <div class="topline"><span class="wordmark">AI USAGE / DESKTOP</span><span class="edition">极小布局 · 横向 / 竖向</span></div>
  <div class="intro"><div><h1>一行，或一列。</h1><p>再去掉标题栏，只留下 5h 与 1w 的余量。</p></div><p class="intro-note">按 1:1 逻辑像素预览。<br>默认不占位置显示来源和操作按钮。</p></div>
  <div class="options" aria-label="布局方案">
    <button type="button" class="option" data-choice="horizontal" aria-pressed="true"><span class="sample" data-sample="horizontal"></span><span class="option-meta"><span class="option-title"><span class="option-name"><span class="choice-mark">✓</span>横向一行</span><span class="option-size">136 × 24</span></span><span class="option-description">5h 94% 1w 42% · 高度仅 24，贴在屏幕边缘。</span></span></button>
    <button type="button" class="option" data-choice="vertical" aria-pressed="false"><span class="sample" data-sample="vertical"></span><span class="option-meta"><span class="option-title"><span class="option-name"><span class="choice-mark">✓</span>竖向四行</span><span class="option-size">44 × 88</span></span><span class="option-description">5h、94%、1w、42% 逐行排列 · 宽度仅 44。</span></span></button>
  </div>
  <div class="preview-bar"><div class="preview-title">桌面试摆 <small id="preview-caption">横向一行 / 136 × 24</small></div><div class="controls">
    <select id="data" aria-label="示例数据"><option value="normal">Codex · 94 / 42%</option><option value="limits">ReClaude · 100 / 0%</option><option value="stale">Codex · 数据过期</option><option value="error">Codex · 查询失败</option></select>
    <select id="appearance" aria-label="外观"><option value="light">浅色桌面</option><option value="dark">深色桌面</option></select>
    <label class="check"><input type="checkbox" id="compare" checked>对比 C 版</label>
  </div></div>
  <div class="desk" id="desk"><span class="desk-label">DESKTOP PREVIEW · 100%</span><div class="reference" id="reference"><span class="reference-label">C · 口袋数字 120 × 56</span><div class="reference-body"><span>Codex</span><div><span>5h</span><span>94%</span></div><div><span>1w</span><span>42%</span></div></div></div><div class="floating" id="floating"></div><span class="desk-hint">整块拖动 · 悬停 / 轻点查看来源与重置时间 · 右键打开菜单</span></div>
  <div class="bottom"><span class="selected-note" id="selection" aria-live="polite">已选横向一行 · 比 C 版占用面积少 51%</span><button type="button" class="text-button" id="reset">恢复位置与显示</button></div>
  <p class="footnote">来源、重置时间和置顶 / 关闭操作按需显示；100% 也能完整放下。浏览器缩放与系统缩放会影响屏幕上的实际大小。</p>
</main>
<script>
(() => {
  'use strict';
  const specs={horizontal:{name:'横向一行',w:136,h:24},vertical:{name:'竖向四行',w:44,h:88}};
  const samples={normal:{source:'Codex',a:94,b:42},limits:{source:'ReClaude',a:100,b:0},stale:{source:'Codex',a:94,b:42,status:'数据已过期 · 正在重试更新'},error:{source:'Codex',a:null,b:null,status:'查询失败 · 等待重试'}};
  const desk=document.getElementById('desk'),floating=document.getElementById('floating'),data=document.getElementById('data'),appearance=document.getElementById('appearance');
  let selected='horizontal',pinned=true,drag=null,timer,tap=false,suppressHover=false;
  const percent=n=>n===null?'—':`${n}<i>%</i>`;
  function widget(type,interactive){const d=samples[data.value];return `<div class="widget ${type}${appearance.value==='dark'?' ink':''}${d.status?' stale':''}"${interactive?' role="button" tabindex="0" aria-haspopup="menu" aria-label="额度悬浮窗，回车查看详情，Shift F10 打开菜单"':''}><span class="pair"><span class="period">5h</span><span class="amount">${percent(d.a)}</span></span><span class="pair"><span class="period">1w</span><span class="amount">${percent(d.b)}</span></span>${interactive?`<div class="details" hidden><div class="details-title"><span>${d.source} · 剩余额度</span><button type="button" class="small-button" data-action="menu" aria-label="悬浮窗菜单">…</button></div><div class="details-row"><span>5 小时 · ${d.a===null?'—':d.a+'%'}</span><strong>${d.a===null?'--':'重置 02:41'}</strong></div><div class="details-row"><span>一周 · ${d.b===null?'—':d.b+'%'}</span><strong>${d.b===null?'--':'10-23 14:08'}</strong></div><footer>${d.status||'示例数据 · '+(pinned?'始终置顶':'始终置底')}</footer></div><div class="menu" hidden><button type="button" data-action="details">查看来源与重置时间</button><button type="button" data-action="pin">${pinned?'✓ 始终置顶':'始终置顶'}</button><button type="button" data-action="bottom">${pinned?'始终置底':'✓ 始终置底'}</button><button type="button" data-action="close">隐藏预览</button></div>`:''}</div>`;}
  function reset(){floating.hidden=false;floating.style.left='50%';floating.style.top=innerWidth<=720?'150px':'118px';floating.style.transform='translateX(-50%)';}
  function closePanels(){clearTimeout(timer);floating.querySelectorAll('.details,.menu').forEach(e=>e.hidden=true);}
  function fit(panel){
    const r=floating.getBoundingClientRect(),d=desk.getBoundingClientRect();
    let x=selected==='vertical'?r.width+9:0,y=selected==='vertical'?0:r.height+9;
    if(r.left+x+panel.offsetWidth>d.right-8)x=d.right-8-panel.offsetWidth-r.left;
    if(r.left+x<d.left+8)x=d.left+8-r.left;
    if(r.top+y+panel.offsetHeight>d.bottom-8)y=r.height-panel.offsetHeight-(selected==='horizontal'?r.height+9:0);
    if(r.top+y<d.top+8)y=d.top+8-r.top;
    panel.style.left=x+'px';panel.style.top=y+'px';
  }
  function show(kind){closePanels();const p=floating.querySelector('.'+kind);p.hidden=false;fit(p);}
  function render(){
    clearTimeout(timer);drag=null;suppressHover=false;
    document.querySelectorAll('[data-sample]').forEach(e=>e.innerHTML=widget(e.dataset.sample,false));
    floating.innerHTML=widget(selected,true);
    desk.classList.toggle('dark',appearance.value==='dark');
    const s=specs[selected];document.getElementById('preview-caption').textContent=`${s.name} / ${s.w} × ${s.h}`;
    document.getElementById('selection').textContent=`已选${s.name} · 比 C 版占用面积少 ${Math.round((1-s.w*s.h/(120*56))*100)}%`;
    const w=floating.querySelector('.widget');
    w.addEventListener('pointerenter',()=>{clearTimeout(timer);if(!drag&&!suppressHover&&floating.querySelector('.menu').hidden)timer=setTimeout(()=>{if(!drag&&!suppressHover)show('details');},500);});
    w.addEventListener('pointerleave',()=>{clearTimeout(timer);if(!tap)closePanels();suppressHover=false;});
    w.addEventListener('keydown',e=>{if(e.target!==w)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();show('details');tap=true;}else if(e.key==='F10'&&e.shiftKey){e.preventDefault();show('menu');tap=true;}});
    w.addEventListener('contextmenu',e=>{e.preventDefault();show('menu');tap=true;});
    w.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='menu'||action==='details'){show(action==='menu'?'menu':'details');tap=true;}else if(action==='pin'||action==='bottom'){pinned=action==='pin';render();}else if(action==='close'){floating.hidden=true;closePanels();}});
    w.addEventListener('pointerdown',e=>{
      if(e.button!==0||e.target.closest('button,.details,.menu'))return;
      closePanels();suppressHover=true;tap=false;
      const r=floating.getBoundingClientRect(),d=desk.getBoundingClientRect();
      drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:r.left-d.left,top:r.top-d.top,moved:false};
      floating.style.transform='none';floating.style.left=drag.left+'px';floating.style.top=drag.top+'px';w.setPointerCapture(e.pointerId);
    });
    w.addEventListener('pointermove',e=>{
      if(!drag||drag.id!==e.pointerId)return;
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!drag.moved&&Math.hypot(dx,dy)<3)return;drag.moved=true;
      floating.style.left=Math.max(8,Math.min(desk.clientWidth-w.offsetWidth-8,drag.left+dx))+'px';
      floating.style.top=Math.max(36,Math.min(desk.clientHeight-w.offsetHeight-62,drag.top+dy))+'px';
    });
    w.addEventListener('pointerup',()=>{if(!drag)return;const moved=drag.moved;drag=null;if(!moved){show('details');tap=true;}});
    w.addEventListener('pointercancel',()=>{drag=null;});
  }
  document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));tap=false;reset();render();}));
  data.addEventListener('change',()=>{tap=false;reset();render();});appearance.addEventListener('change',()=>{tap=false;render();});
  document.getElementById('compare').addEventListener('change',e=>document.getElementById('reference').hidden=!e.target.checked);
  document.getElementById('reset').addEventListener('click',()=>{tap=false;reset();closePanels();});
  document.addEventListener('pointerdown',e=>{if(!floating.contains(e.target)){tap=false;closePanels();}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){tap=false;closePanels();}});
  window.addEventListener('resize',()=>{reset();closePanels();});
  reset();render();
})();
</script>
</body>
</html>
