<style>

  #quota-designs .qd-popover button:hover { background:var(--q-hover); }

  #quota-designs .qd-obsidian {
    color-scheme:dark; --q-surface:#232827; --q-text:#edf3ef; --q-muted:#a1ada6;
    --q-track:#3c4640; --q-line:#3b4440; --q-hover:#333e37; --q-accent:#9bcbb0;
    --q-width:348px; --q-height:150px; --q-radius:14px; padding:13px 16px 17px; gap:17px;
    box-shadow:0 15px 40px #17282d38,0 3px 7px #17282d18,0 0 0 1px #ffffff12;
  }
  #quota-designs .qd-subtitle { color:var(--q-muted); font-size:11px; font-weight:400; margin-left:1px; }
  #quota-designs .qd-obsidian .qd-monogram { background:#35453b; color:#b7d8c4; }
  #quota-designs .qd-instruments { display:grid; grid-template-columns:1fr 1fr; gap:18px; flex:1; min-height:0; }
  #quota-designs .qd-instrument { display:flex; flex-direction:column; justify-content:space-between; gap:8px; }
  #quota-designs .qd-instrument+ .qd-instrument { border-left:1px solid var(--q-line); padding-left:18px; }
  #quota-designs .qd-instrument-top { display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  #quota-designs .qd-instrument-top .qd-period { font-size:11px; }
  #quota-designs .qd-large-value { font-size:27px; line-height:1; letter-spacing:-1px; font-weight:400; }
  #quota-designs .qd-large-value>span { font-size:12px; color:var(--q-muted); margin-left:3px; letter-spacing:0; }
  #quota-designs .qd-obsidian .qd-track { height:4px; }
  #quota-designs .qd-strip { --q-width:330px; --q-height:132px; --q-radius:12px; --q-accent:#6d8ba6; padding:11px 15px 15px; gap:10px; }
  #quota-designs .qd-brand-dot { width:7px; height:7px; border-radius:50%; background:var(--q-accent); margin-right:2px; }
  #quota-designs .qd-strip .qd-brand { font-size:12px; }
  #quota-designs .qd-strip-body { display:flex; flex:1; flex-direction:column; justify-content:space-between; gap:10px; }
  #quota-designs .qd-strip-row { display:grid; grid-template-columns:99px minmax(20px,1fr) 36px; gap:11px; align-items:center; }
  #quota-designs .qd-strip-label { display:flex; flex-direction:column; gap:1px; }
  #quota-designs .qd-strip-label .qd-period { font-size:11px; }
  #quota-designs .qd-strip .qd-track { height:4px; }
  #quota-designs .qd-strip-value { text-align:right; font-size:17px; font-weight:500; letter-spacing:-.5px; }
  #quota-designs .qd-strip-value>span { font-size:10px; color:var(--q-muted); font-weight:400; margin-left:2px; }
  @media (pointer:coarse) { #quota-designs .qd-icon { width:30px; height:30px; } #quota-designs .qd-resize { width:24px; height:24px; right:0; bottom:0; } }
  @media (max-width:380px) { #quota-designs .qd-desktop { height:340px; } #quota-designs .qd-window { left:16px; padding-left:14px; padding-right:14px; } #quota-designs .qd-stage-label,#quota-designs .qd-stage-hint { left:16px; } #quota-designs .qd-instruments { gap:12px; } #quota-designs .qd-instrument+.qd-instrument { padding-left:12px; } }

<script>
(() => {
  const root = document.getElementById('quota-designs');
  const initial = window.openai?.widgetState?.privateContent;
  const specs = {
    paper: { width:296, height:166, radius:16, accent:'#509f80', minWidth:264, minHeight:158 },
    obsidian: { width:348, height:150, radius:14, accent:'#9bcbb0', minWidth:264, minHeight:146 },
    strip: { width:330, height:132, radius:12, accent:'#6d8ba6', minWidth:264, minHeight:128 }
  };
  const components = [];
  function persist() {
    if (!window.openai?.setWidgetState) return;
    const settings = Object.fromEntries(components.map(c => [c.key, {...c.state}]));
    window.openai.setWidgetState({modelContent:{designs:settings},privateContent:settings}).catch(() => {});
  }
  root.querySelectorAll('[data-design]').forEach(card => {
    const key = card.dataset.design;
    const spec = specs[key];
    const saved = initial?.[key];
    const state = {width:spec.width, height:spec.height, radius:spec.radius, accent:spec.accent, layer:'top', x:null, y:null};
    if (saved && typeof saved === 'object') {
      ['width','height','radius'].forEach(p => { if (Number.isFinite(saved[p])) state[p]=saved[p]; });
      if (/^#[0-9a-f]{6}$/i.test(saved.accent || '')) state.accent=saved.accent;
      if (saved.layer==='bottom') state.layer='bottom';
      if (Number.isFinite(saved.x) && Number.isFinite(saved.y)) { state.x=saved.x;state.y=saved.y; }
    }
    const stage = card.parentElement;
    const menu = card.querySelector('.qd-popover');
    const pin = card.querySelector('[data-pin]');
    const menuButton = card.querySelector('[data-menu]');
    const reopen = stage.querySelector('.qd-reopen');
    const component = {key,state}; components.push(component);
    function render() {
      state.width=Math.max(spec.minWidth,Math.min(480,state.width));
      state.height=Math.max(spec.minHeight,Math.min(260,state.height));
      state.radius=Math.max(4,Math.min(24,state.radius));
      card.style.setProperty('--q-width',state.width+'px');
      card.style.setProperty('--q-height',state.height+'px');
      card.style.setProperty('--q-radius',state.radius+'px');
      card.style.setProperty('--q-accent',state.accent);
      if (state.x!==null && stage.clientWidth) {
        state.x=Math.max(8,Math.min(stage.clientWidth-card.offsetWidth-8,state.x));
        state.y=Math.max(48,Math.min(stage.clientHeight-card.offsetHeight-45,state.y));
        card.style.left=state.x+'px';card.style.top=state.y+'px';
      }
      const on=state.layer==='top';
      pin.classList.toggle('qd-pinned',on);
      pin.setAttribute('aria-pressed',String(on));
      pin.setAttribute('aria-label',on?'取消置顶':'开启置顶');
      pin.dataset.tooltip=on?'始终置顶':'始终置底';
      card.querySelectorAll('[data-layer-check]').forEach(c => { c.hidden=c.dataset.layerCheck!==state.layer; });
    }
    function closeMenu() { menu.hidden=true;menuButton.setAttribute('aria-expanded','false'); }
    render();
    pin.addEventListener('click',()=>{state.layer=state.layer==='top'?'bottom':'top';render();persist();});
    menuButton.addEventListener('click',()=>{menu.hidden=!menu.hidden;menuButton.setAttribute('aria-expanded',String(!menu.hidden));});
    card.querySelectorAll('[data-layer]').forEach(button=>button.addEventListener('click',()=>{state.layer=button.dataset.layer;closeMenu();render();persist();}));
    card.querySelector('[data-corner]').addEventListener('click',()=>{state.x=stage.clientWidth-card.offsetWidth-20;state.y=52;closeMenu();render();persist();});
    card.querySelector('[data-close]').addEventListener('click',()=>{card.hidden=true;reopen.hidden=false;closeMenu();});
    reopen.addEventListener('click',()=>{card.hidden=false;reopen.hidden=true;render();});
    stage.addEventListener('pointerdown',e=>{if(!menu.contains(e.target) && !menuButton.contains(e.target))closeMenu();});
    function gesture(handle, resizing) {
      let start=null;
      handle.addEventListener('pointerdown',e=>{
        if (e.button!==0 || e.target.closest('button')) return;
        closeMenu();
        const s=stage.getBoundingClientRect(),r=card.getBoundingClientRect();
        start={px:e.clientX,py:e.clientY,x:r.left-s.left,y:r.top-s.top,width:r.width,height:r.height};
        handle.setPointerCapture(e.pointerId);e.preventDefault();
      });
      handle.addEventListener('pointermove',e=>{
        if(!start)return;
        if(resizing){state.width=Math.min(stage.clientWidth-start.x-8,Math.max(spec.minWidth,start.width+e.clientX-start.px));state.height=Math.min(stage.clientHeight-start.y-45,Math.max(spec.minHeight,start.height+e.clientY-start.py));}
        else {state.x=start.x+e.clientX-start.px;state.y=start.y+e.clientY-start.py;}
        render();
      });
      const finish=()=>{if(start){start=null;persist();}};
      handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);
    }
    gesture(card.querySelector('[data-drag]'),false);gesture(card.querySelector('[data-resize]'),true);
    if (globalThis.Tweak) {
      const tweak=new Tweak({container:card,onChange:()=>{render();persist();}});
      tweak.addSlider(state,'width',{label:'宽度',min:spec.minWidth,max:480,unit:'px'});
      tweak.addSlider(state,'height',{label:'高度',min:spec.minHeight,max:260,unit:'px'});
      tweak.addSlider(state,'radius',{label:'圆角',min:4,max:24,unit:'px'});
      tweak.addColorPicker(state,'accent',{label:'进度条颜色',reference:'--q-accent'});
    }
    component.render=render;
  });
  window.addEventListener('openai:set_globals',e=>{
    const saved=e.detail?.globals?.widgetState?.privateContent;
    if(!saved)return;
    components.forEach(c=>{
      const item=saved[c.key];if(!item)return;
      ['width','height','radius','x','y'].forEach(p=>{if(Number.isFinite(item[p]))c.state[p]=item[p];});
      if(/^#[0-9a-f]{6}$/i.test(item.accent||''))c.state.accent=item.accent;
      if(item.layer==='top'||item.layer==='bottom')c.state.layer=item.layer;
      c.render();
    });
  });
})();
</script>
