# 推送 tag 时自动创建 Draft Release，构建 Windows exe 并上传为 Release 资产。
#
# Fyne 版需要 CGO + C 编译器（windows-latest 自带 MinGW-w64 gcc），
# MyGo 版使用纯 Go 构建。两版分别使用各自的 Go 工具链，只产出 Windows amd64。
name: Build Windows Release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write # 需要写权限把 exe 附加到 Release

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host # Go module 在 host/ 下
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: host/go.sum

      - name: Verify gcc (Fyne 需要 CGO)
        run: gcc --version

      - name: Build exe (-s -w -H=windowsgui)
        env:
          CGO_ENABLED: 1
        run: go build -ldflags "-s -w -H=windowsgui" -o "bin/esp32-ai-usage-${{ github.ref_name }}.exe" .

      - name: Set up Go for MyGo
        uses: actions/setup-go@v5
        with:
          go-version-file: host-mygo/go.mod
          cache-dependency-path: host-mygo/go.sum

      - name: Build MyGo exe (-s -w -H=windowsgui)
        working-directory: host-mygo
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o "bin/esp32-ai-usage-mygo-${{ github.ref_name }}.exe" .

      - name: Create draft release and attach exes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            host/bin/esp32-ai-usage-${{ github.ref_name }}.exe
            host-mygo/bin/esp32-ai-usage-mygo-${{ github.ref_name }}.exe
